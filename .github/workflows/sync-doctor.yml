name: sync-doctor image

on:
  push:
    branches: [main]
    paths: ["sync-doctor/**", ".github/workflows/sync-doctor.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: sync-doctor
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/foreverramone/bazarr-sync-doctor:latest
            ghcr.io/foreverramone/bazarr-sync-doctor:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Comprueba con ffsubsync y alass las sincronizaciones de Bazarr
          cache-from: type=gha
          cache-to: type=gha,mode=max
